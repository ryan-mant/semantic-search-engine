services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_USERNAME}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASSWORD}"
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:29093,PLAINTEXT_HOST://:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/bin/kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  localstack:
    image: localstack/localstack:3.0.0
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,logs
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4566/_localstack/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "${MONGO_URI}"
      MONGO_DATABASE: "${MONGO_DATABASE}"
      MONGO_USERNAME: "${MONGO_USERNAME}"
      MONGO_PASSWORD: "${MONGO_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CHROMA_HOST: "${CHROMA_HOST}"
      CHROMA_PORT: "${CHROMA_PORT}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_CLOUDWATCH_LOG_GROUP: "${AWS_CLOUDWATCH_LOG_GROUP}"
      AWS_CLOUDWATCH_LOG_STREAM: "${AWS_CLOUDWATCH_LOG_STREAM}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chroma:
        condition: service_started
      localstack:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 1G

  api-test:
    build:
      context: .
      dockerfile: API/Dockerfile
      target: development
    environment:
      MONGO_URI: "${MONGO_URI}"
      MONGO_DATABASE: "${MONGO_DATABASE}"
      MONGO_USERNAME: "${MONGO_USERNAME}"
      MONGO_PASSWORD: "${MONGO_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CHROMA_HOST: "${CHROMA_HOST}"
      CHROMA_PORT: "${CHROMA_PORT}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_CLOUDWATCH_LOG_GROUP: "${AWS_CLOUDWATCH_LOG_GROUP}"
      AWS_CLOUDWATCH_LOG_STREAM: "${AWS_CLOUDWATCH_LOG_STREAM}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chroma:
        condition: service_started
      localstack:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      MONGO_URI: "${MONGO_URI}"
      MONGO_DATABASE: "${MONGO_DATABASE}"
      MONGO_USERNAME: "${MONGO_USERNAME}"
      MONGO_PASSWORD: "${MONGO_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CHROMA_HOST: "${CHROMA_HOST}"
      CHROMA_PORT: "${CHROMA_PORT}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_CLOUDWATCH_LOG_GROUP: "${AWS_CLOUDWATCH_LOG_GROUP}"
      AWS_CLOUDWATCH_LOG_STREAM: "${AWS_CLOUDWATCH_LOG_STREAM}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chroma:
        condition: service_started
      localstack:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G

  worker-test:
    build:
      context: .
      dockerfile: worker/Dockerfile
      target: development
    environment:
      MONGO_URI: "${MONGO_URI}"
      MONGO_DATABASE: "${MONGO_DATABASE}"
      MONGO_USERNAME: "${MONGO_USERNAME}"
      MONGO_PASSWORD: "${MONGO_PASSWORD}"
      KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_BOOTSTRAP_SERVERS}"
      CHROMA_HOST: "${CHROMA_HOST}"
      CHROMA_PORT: "${CHROMA_PORT}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      AWS_S3_BUCKET: "${AWS_S3_BUCKET}"
      AWS_CLOUDWATCH_LOG_GROUP: "${AWS_CLOUDWATCH_LOG_GROUP}"
      AWS_CLOUDWATCH_LOG_STREAM: "${AWS_CLOUDWATCH_LOG_STREAM}"
      AWS_ENDPOINT_URL: "${AWS_ENDPOINT_URL}"
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      chroma:
        condition: service_started
      localstack:
        condition: service_healthy

volumes:
  mongo_data:
  chroma_data:
  localstack_data: